ekf_filter_node:
  ros__parameters:
    frequency: 50.0
    two_d_mode: true

    publish_tf: true

    map_frame: map
    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: odom

    # ── Wheel odometry (TwistWithCovarianceStamped) ──────────────────────────
    twist0: /wheel_twist
    twist0_config: [false, false, false,
                    false, false, false,
                    true,  false, false,
                    false, false, false,
                    false, false, false]
    # vx=true: tốc độ tiến/lùi từ encoder
    # vy=false: differential drive không trượt ngang
    twist0_differential: false
    twist0_reject_threshold: 2.0

    # ── IMU (sensor_msgs/Imu) ────────────────────────────────────────────────
    imu0: /imu/data
    imu0_config: [false, false, false,
                  false, false, false,
                  false, false, false,
                  false, false, true,
                  false, false, false]
    # vyaw=true (index 11): chỉ dùng tốc độ góc yaw từ gyroscope
    imu0_differential: false
    imu0_relative: false
    imu0_remove_gravitational_acceleration: false
    imu0_reject_threshold: 2.0

    # ── Noise covariance ─────────────────────────────────────────────────────
