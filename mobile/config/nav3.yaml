controller_server:
  ros__parameters:
    odom_topic: /odometry/filtered  
    # controller server parameters (see Controller Server for more info)
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.01
    min_y_velocity_threshold: 0.0
    min_theta_velocity_threshold: 0.01
    progress_checker_plugins: "progress_checker" # progress_checker_plugin: "progress_checker" For Humble and older
    goal_checker_plugins: ["goal_checker"]
    controller_plugins: ["FollowPath"]
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.05
      movement_time_allowance: 15.0
    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.15
      yaw_goal_tolerance: 0.15
      stateful: True
    # DWB controller parameters
    FollowPath: 
      plugin: "dwb_core::DWBLocalPlanner" 
      debug_trajectory_details: True 
      min_vel_x: 0.0 
      min_vel_y: 0.0 
      max_vel_x: 0.35 #0.25
      max_vel_y: 0.0 
      max_vel_theta: 0.50 
      min_speed_xy: 0.0
      max_speed_xy: 0.35 #02.5
      min_speed_theta: 0.05 
      acc_lim_x: 0.2   
      acc_lim_y: 0.0 
      acc_lim_theta: 0.25 
      decel_lim_x: -0.2
      decel_lim_y: 0.0
      decel_lim_theta: -0.25
      vx_samples: 10
      vy_samples: 1
      vtheta_samples: 10
      sim_time: 1.7 #3.5
      linear_granularity: 0.05
      angular_granularity: 0.025
      transform_tolerance: 0.15
      xy_goal_tolerance: 0.1
      trans_stopped_velocity: 0.05
      short_circuit_trajectory_evaluation: True
      limit_vel_cmd_in_traj: False
      stateful: False
      slowdown_factor: 0.5
      critics: ["RotateToGoal", "Oscillation", "BaseObstacle", "GoalAlign", "PathAlign", "PathDist", "GoalDist"]
      BaseObstacle.scale: 0.02
      PathAlign.scale: 32.0
      GoalAlign.scale: 24.0
      PathAlign.forward_point_distance: 0.1
      GoalAlign.forward_point_distance: 0.1
      PathDist.scale: 32.0
      GoalDist.scale: 24.0
      RotateToGoal.scale: 32.0
      RotateToGoal.slowing_factor: 3.0
      RotateToGoal.lookahead_time: -1.0

velocity_smoother:
  ros__parameters:

    use_sim_time: true
    # use_sim_time: false
    smoothing_frequency: 20.0
    feedback: "OPEN_LOOP"

    # 🔥 KHỚP với DWB
    max_velocity: [0.35, 0.0, 0.8]
    min_velocity: [-0.35, 0.0, -0.8]

    # 🔥 GIA TỐC HỢP LÝ
    max_accel: [0.2, 0.0, 0.8]
    max_decel: [-0.2, 0.0, -1.0]   # giảm nhanh hơn tăng

    velocity_timeout: 1.0

    scale_velocities: false

    deadband_velocity: [0.0, 0.0, 0.0]
