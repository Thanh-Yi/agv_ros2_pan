# =====================================
# LOCAL COSTMAP
# =====================================
local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: True
      # use_sim_time: false
      global_frame: odom
      robot_base_frame: base_footprint
      update_frequency: 10.0
      publish_frequency: 10.0
      width: 6 #20
      height: 6 #20
      resolution: 0.05
      # footprint: "[ [0.35, 0.25], [0.35, -0.25], [-0.35, -0.25], [-0.35, 0.25] ]"
      footprint: "[ [0.35, 0.3], [0.35, -0.3], [-0.35, -0.3], [-0.35, 0.3] ]"
      rolling_window: True
      always_send_full_costmap: True
      # plugins: ["obstacle_layer" ,"inflation_layer"]
      plugins: ["obstacle_layer" , "inflation_layer"]

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          inf_is_valid: True
          obstacle_range: 12.0
          raytrace_range: 12.75
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: True
        footprint_clearing_enabled: true
        publish_voxel_map: True       # debug
        origin_z: 0.0
        z_resolution: 0.05 #0.05 0.01
        z_voxels: 24 #32                  # phủ tới ~1.6m
        max_obstacle_height: 1.5
        unknown_threshold: 15
        mark_threshold: 1 #1            # 0 = dễ mark hơn nhưng dễ nhiễu
        observation_sources: cam_low 
        combination_method: 1
        cam_low:
          topic: /camera_low/depth/points
          data_type: "PointCloud2"
          marking: True
          clearing: True             # khuyên bắt đầu False cho ổn định
          min_obstacle_height: 0.02 #0.07
          max_obstacle_height: 0.22 #0.22
          obstacle_max_range: 1.2 #2.5
          obstacle_min_range: 0.0
          raytrace_max_range: 1.2
          raytrace_min_range: 0.0
        
      
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.4 #0.5
        cost_scaling_factor: 3.0 #3.0

# =====================================
# SMOOTHER SERVER (Constrained Smoother)
# =====================================
smoother_server:
  ros__parameters:
    use_sim_time: true
    # use_sim_time: false
    smoother_plugins: ["SmoothPath"]

    SmoothPath:
      plugin: "nav2_constrained_smoother/ConstrainedSmoother"

      # Cấu hình cơ bản
      reversing_enabled: false        # diff-drive không cần lùi
      path_downsampling_factor: 2     # giảm số điểm để tính nhanh hơn
      path_upsampling_factor: 2       # nội suy lại cho mượt hơn
      keep_start_orientation: true
      keep_goal_orientation: true
      w_smooth: 8000000.0     # ↑ làm đường cong mượt hơn
      w_dist: 0.75                 # giữ gần với đường planner gốc
      w_cost: 0.2                    # tránh sát vật cản

      # Tối ưu các đoạn đổi hướng gắt
      w_cost_cusp_multiplier: 2.0     # giảm một chút để tránh quá mạnh
      cusp_zone_length: 2.0

      # Cấu hình tối ưu hóa
      optimizer:
        max_iterations: 100           # nhiều vòng hơn giúp tối ưu kỹ
        debug_optimizer: false
        gradient_tol: 1.0e-5
        fn_tol: 1.0e-10
        param_tol: 1.0e-15


